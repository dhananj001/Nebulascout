<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="prismBlue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Group: Symbol Mark -->
  <g transform="translate(16, 14)">
    <polygon points="16,16 30,16 30,76 16,76" fill="#1D1D1F"/>
    <polygon points="62,16 76,16 76,76 62,76" fill="#1D1D1F"/>

    <polygon points="10,82 46,46 46,12" fill="#0052CC"/>
    <polygon points="46,12 82,12 46,46" fill="url(#prismBlue3)"/>
    <polygon points="8,84 84,10 46,47" fill="url(#prismBlue3)" opacity="0.95"/>
    <polygon points="8,84 46,47 38,55" fill="#0284C7"/>
    <circle cx="84" cy="10" r="3" fill="#38BDF8"/>
  </g>

  <!-- Typography: Pure Symmetric Alignment -->
  <g transform="translate(142, 0)">
    <text x="0" y="66" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="-1" 
          fill="#1D1D1F">
      Nebula<tspan fill="#0071E3">Scout</tspan>
    </text>

    <!-- Subtitle: Full Geometric Width Symmetry -->
    <text x="2" y="86" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="5.6" 
          fill="#64748B"
          textLength="258"
          lengthAdjust="spacing">
      OUTREACH &amp; RADAR SYSTEM
    </text>

    <line x1="2" y1="94" x2="260" y2="94" stroke="#0071E3" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  </g>
</svg>
